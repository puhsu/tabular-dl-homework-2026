[project]
name = "tabular-homework"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cyclopts",
    "numpy",
    "tabpackage>=0.0.1",
    "torch",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
